# Portable engine checks only. No game assets, credentials, or paid inference.
name: Franchise AI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned guest runtime for execution checks
        run: git submodule update --init external/xboxrecomp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Financial, negotiation and shutdown tests
        run: python -m unittest discover -s tests -v
      - name: Audit regression checks and compensation conservation
        run: python -m tools.audit_money
      - name: Offline contract and negotiation examples
        run: |
          python -m examples.negotiation
          python -m examples.story_negotiation --provider scripted
          python -m examples.persistent_negotiation
          python -m examples.personality_continuity
      - name: Build standalone engine sidecar addon
        run: |
          cmake -S addons/engine-sidecar -B build-engine-sidecar
          cmake --build build-engine-sidecar --config Release
          ctest --test-dir build-engine-sidecar -C Release --output-on-failure
      - name: Check actual guest lock and addon read ownership
        run: |
          cmake -S native/guest_execution -B build-guest-execution
          cmake --build build-guest-execution --config Release
          ctest --test-dir build-guest-execution -C Release --output-on-failure
      - name: Compile asset-free native protocol and Windows pipe client
        run: |
          cmake -S native/franchise_bridge -B build-franchise-bridge
          cmake --build build-franchise-bridge --config Release
      - name: Execute native protocol boundary checks
        run: ctest --test-dir build-franchise-bridge -C Release --output-on-failure
      - name: Cross-check exact native guest salary schedules
        run: python -m tools.check_native_guest_terms build-franchise-bridge
      - name: Compare native financial and identity capture to saved semantics
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m tools.check_native_finance_state build-franchise-bridge/Release/franchise_finance_state_check.exe
            python -m tools.check_native_identity_state build-franchise-bridge/Release/franchise_finance_state_check.exe
          else
            python -m tools.check_native_finance_state build-franchise-bridge/franchise_finance_state_check
            python -m tools.check_native_identity_state build-franchise-bridge/franchise_finance_state_check
          fi
      - name: Check interpreter shared epilogues
        if: runner.os == 'Windows'
        run: |
          cmake -S native/interpreter -B build-interpreter-check
          cmake --build build-interpreter-check --config Release
          ctest --test-dir build-interpreter-check -C Release --output-on-failure
      - name: Execute native pipe handshake and durable restart fixture
        if: runner.os == 'Windows'
        run: python -m tools.check_native_bridge build-franchise-bridge/Release/franchise_bridge_check.exe build-franchise-bridge/Release/franchise_c_host_check.exe
      - name: Execute native saved-signing coordination without inference
        if: runner.os == 'Windows'
        run: python -m tools.check_native_saved_signing build-franchise-bridge/Release/franchise_saved_signing_check.exe
