# Portable engine checks only. No game assets, credentials, or paid inference.
name: Franchise AI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Financial, negotiation and shutdown tests
        run: python -m unittest discover -s tests -v
      - name: Audit regression checks and compensation conservation
        run: python -m tools.audit_money
      - name: Offline contract and negotiation examples
        run: |
          python -m examples.negotiation
          python -m examples.story_negotiation --provider scripted
          python -m examples.persistent_negotiation
          python -m examples.personality_continuity
      - name: Compile asset-free native protocol and Windows pipe client
        run: |
          cmake -S native/franchise_bridge -B build-franchise-bridge
          cmake --build build-franchise-bridge --config Release
      - name: Execute native protocol boundary checks
        run: ctest --test-dir build-franchise-bridge -C Release --output-on-failure
      - name: Cross-check exact native guest salary schedules
        run: python -m tools.check_native_guest_terms build-franchise-bridge
      - name: Execute native pipe handshake and durable restart fixture
        if: runner.os == 'Windows'
        run: python -m tools.check_native_bridge build-franchise-bridge/Release/franchise_bridge_check.exe build-franchise-bridge/Release/franchise_c_host_check.exe
